name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm test

  mobile:
    name: Godot project check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - name: Project file present
        run: test -f apps/mobile/project.godot
      - name: GDScript lint (no scripts yet is fine)
        run: |
          if find apps/mobile -name "*.gd" | grep -q .; then
            find apps/mobile -name "*.gd" -print0 | xargs -0 gdlint
          else
            echo "no GDScript files yet"
          fi

  contract:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli@1 lint packages/shared/openapi/openapi.yaml
